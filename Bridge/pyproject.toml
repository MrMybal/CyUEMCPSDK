[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cyue-mcp"
version = "0.1.5"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cytools-core[mcp]==0.9.0", "Pillow>=11,<13", "pypdf>=6,<7"]
[tool.setuptools.packages.find]
include = ["cyue_mcp*"]

[tool.setuptools.package-data]
"cyue_mcp.providers" = ["descriptors/*.json"]
